services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: findoc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Un-comment or use profile 'full' when deploying the FastAPI backend in Docker
  findoc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findoc-api
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_USE_LOCAL=false
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
    name: findoc_qdrant_storage
