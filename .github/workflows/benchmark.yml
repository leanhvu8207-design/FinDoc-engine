name: FinDoc-Engine Retrieval Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run Retrieval Benchmark Suite (Phase 5)
        run: python tests/evaluation/evaluate_retrieval.py
